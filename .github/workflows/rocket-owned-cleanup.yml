{
  "name": "Rocket bounded cleanup verification and monitor",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "mode": {
          "type": "choice",
          "options": [
            "verify",
            "monitor"
          ],
          "default": "verify",
          "required": true
        }
      }
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "mpt-rocket-project-16725375-cleanup",
    "cancel-in-progress": false
  },
  "jobs": {
    "controller": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "env": {
        "HETZNER_TEST_PROJECT_TOKEN": "${{ secrets.HETZNER_TEST_PROJECT_TOKEN }}",
        "CLEANUP_STATE_JSON": "${{ secrets.CLEANUP_STATE_JSON }}"
      },
      "steps": [
        {
          "name": "Write audited generic controller and tests",
          "run": "cat > cleanup_controller.py <<'MPT_GENERIC_PY'\n\"\"\"Prepared, not armed. Deletes only two nonce-labelled resources from one new test project.\"\"\"\nimport datetime as dt, decimal, json, os, time, urllib.request, urllib.error\nclass GuardError(RuntimeError): pass\nclass ProviderError(RuntimeError): pass\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,*a,**k):raise GuardError(\"PROVIDER_REDIRECT_REFUSED\")\ndef validate(s):\n if s.get('approved') is not True or s.get('project_name')!='mpt-rocket-12h-20261109' or s.get('project_id')!=16725375:raise GuardError('NEW_APPROVAL_REQUIRED')\n for k in ['project_id','server_id','primary_ip_id']:\n  if type(s.get(k)) is not int or s[k]<=0:raise GuardError('EXACT_IDS_REQUIRED')\n if len(s.get('nonce',''))<32:raise GuardError('OWNERSHIP_NONCE_REQUIRED')\n if s.get('maximum_hours')!=12 or decimal.Decimal(s.get('maximum_gross_eur','0'))!=decimal.Decimal('2.00'):raise GuardError('BUDGET_SCOPE')\n created=dt.datetime.fromisoformat(s['first_billable_utc']);due=dt.datetime.fromisoformat(s['delete_at_utc'])\n if not created.tzinfo or not due.tzinfo or not created<due<=created+dt.timedelta(hours=5):raise GuardError('EARLY_DELETE_REQUIRED')\n rate=decimal.Decimal(s['hourly_gross_eur'])\n if rate<=0 or rate*12+decimal.Decimal(s.get('other_gross_eur','0'))>decimal.Decimal('2.00'):raise GuardError('COST_CAP')\n return due\ndef owned(x,s,kind):\n if x.get('id')!=s[kind+'_id'] or x.get('labels',{}).get('mpt-test-run')!=s['nonce']:raise GuardError('OWNERSHIP_MISMATCH')\ndef execute(s,api,now):\n due=validate(s)\n server=api('GET','/servers/'+str(s['server_id']));ip=api('GET','/primary_ips/'+str(s['primary_ip_id']))\n if server:owned(server['server'],s,'server')\n if ip:\n  owned(ip['primary_ip'],s,'primary_ip')\n  if ip['primary_ip'].get('assignee_id') not in [None,s['server_id']]:raise GuardError('OTHER_IP_ASSIGNEE')\n if not server and not ip:return 'PASS_SERVER_AND_IPV4_DELETED'\n if now<due:return 'ARMED_OWNERSHIP_VERIFIED'\n if server:api('DELETE','/servers/'+str(s['server_id']))\n for _ in range(60):\n  if not api('GET','/servers/'+str(s['server_id'])):break\n  time.sleep(1)\n else:raise GuardError('SERVER_DELETE_NOT_VERIFIED')\n # Server deletion and IP unassignment are eventually consistent.\n for _ in range(90):\n  ip=api('GET','/primary_ips/'+str(s['primary_ip_id']))\n  if not ip:break\n  owned(ip['primary_ip'],s,'primary_ip')\n  assignee=ip['primary_ip'].get('assignee_id')\n  if assignee is None:break\n  if assignee!=s['server_id']:raise GuardError('OTHER_IP_ASSIGNEE')\n  time.sleep(1)\n else:raise GuardError('IP_RELEASE_NOT_VERIFIED')\n if ip:api('DELETE','/primary_ips/'+str(s['primary_ip_id']))\n if api('GET','/primary_ips/'+str(s['primary_ip_id'])):raise GuardError('IP_DELETE_NOT_VERIFIED')\n return 'PASS_SERVER_AND_IPV4_DELETED'\ndef main():\n s=json.loads(os.environ['CLEANUP_STATE_JSON']);token=os.environ['HETZNER_TEST_PROJECT_TOKEN'];assert token\n if s.get('approved') is not True or s.get('project_name')!='mpt-rocket-12h-20261109' or s.get('project_id')!=16725375 or len(s.get('nonce',''))<32:raise GuardError('PREORDER_SCOPE_REQUIRED')\n if s.get('maximum_hours')!=12 or decimal.Decimal(s.get('maximum_gross_eur','0'))!=decimal.Decimal('2.00') or decimal.Decimal(s['hourly_gross_eur'])*12+decimal.Decimal(s.get('other_gross_eur','0'))>decimal.Decimal('2.00'):raise GuardError('PREORDER_BUDGET_REFUSED')\n selector='?label_selector=mpt-test-run%3D'+s['nonce'];discovery={'/servers'+selector,'/primary_ips'+selector};allowed=set();start=dt.datetime.now(dt.timezone.utc)\n def api(method,path):\n  if not ((method=='GET' and path in discovery) or (method in ['GET','DELETE'] and path in allowed)):raise GuardError('ENDPOINT_REFUSED')\n  req=urllib.request.Request('https://api.hetzner.cloud/v1'+path,method=method,headers={'Authorization':'Bearer '+token})\n  try:\n   with urllib.request.build_opener(NoRedirect()).open(req,timeout=20) as r:b=r.read();return json.loads(b) if b else {}\n  except urllib.error.HTTPError as e:\n   if e.code==404:return None\n   raise ProviderError('PROVIDER_STATUS_'+str(e.code)) from None\n  except (urllib.error.URLError,TimeoutError,OSError):raise ProviderError('TRANSPORT') from None\n print('PREORDER_CONTROLLER_RUNNING_NO_BILLABLE_RESOURCE_REQUIRED',flush=True)\n # Run BEFORE ordering. Exact unique nonce/name and new project token bind at most one server and IP.\n while True:\n  try:\n   servers=api('GET','/servers'+selector)['servers'];ips=api('GET','/primary_ips'+selector)['primary_ips']\n  except ProviderError:\n   print('PROVIDER_RETRY_NO_SECRET_OUTPUT',flush=True);time.sleep(15);continue\n  if not servers and not ips and os.environ.get('RECOVERY_MODE')=='true':\n   print('PASS_NO_NONCE_OWNED_RESOURCES_REMAIN',flush=True);return\n  if len(servers)>1 or len(ips)>1:raise GuardError('AMBIGUOUS_DISCOVERY_NO_DELETE')\n  for x in servers+ips:\n   if x.get('labels',{}).get('mpt-test-run')!=s['nonce']:raise GuardError('NONCE_MISMATCH')\n  if servers and servers[0].get('name')!='mpt-rocket-12h-20261109':raise GuardError('SERVER_NAME_MISMATCH')\n  if servers and ips:\n   sv,ip=servers[0],ips[0]\n   if ip.get('assignee_id')!=sv['id']:raise GuardError('DISCOVERY_IP_ASSIGNMENT')\n   created=min(dt.datetime.fromisoformat(x['created'].replace('Z','+00:00')) for x in [sv,ip]);s.update(server_id=sv['id'],primary_ip_id=ip['id'],first_billable_utc=created.isoformat(),delete_at_utc=(created+dt.timedelta(hours=4,minutes=55)).isoformat());allowed.update(['/servers/'+str(s['server_id']),'/primary_ips/'+str(s['primary_ip_id'])]);validate(s);break\n  if ips and not servers:\n   ip=ips[0];age=(dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(ip['created'].replace('Z','+00:00'))).total_seconds()\n   if age>600:\n    if ip.get('assignee_id') is not None:raise GuardError('ORPHAN_IP_ASSIGNED')\n    path='/primary_ips/'+str(ip['id']);allowed.add(path);api('DELETE',path)\n    if api('GET',path):raise GuardError('ORPHAN_IP_DELETE_UNVERIFIED')\n    print('PASS_ORPHAN_IPV4_REMOVED',flush=True);return\n  if (dt.datetime.now(dt.timezone.utc)-start).total_seconds()>900:raise GuardError('ORDER_WINDOW_EXPIRED_NO_START')\n  print('PREORDER_OWNERSHIP_DISCOVERY_READY',flush=True);time.sleep(10)\n print('EXACT_RESOURCE_IDS_PINNED_IN_MEMORY',flush=True)\n while True:\n  try:result=execute(s,api,dt.datetime.now(dt.timezone.utc))\n  except ProviderError:\n   print('PROVIDER_RETRY_NO_SECRET_OUTPUT',flush=True);time.sleep(15);continue\n  print(result,flush=True)\n  if result=='PASS_SERVER_AND_IPV4_DELETED':return\n  time.sleep(min(60,max(1,(validate(s)-dt.datetime.now(dt.timezone.utc)).total_seconds())))\nif __name__=='__main__':\n try:main()\n except Exception as e:print('FAIL_CLEANUP_'+(str(e) if isinstance(e,(GuardError,ProviderError)) else type(e).__name__),flush=True);raise SystemExit(1)\n\nMPT_GENERIC_PY\ncat > test_cleanup.py <<'MPT_GENERIC_PY'\nimport cleanup_controller as c,datetime as d,copy,json\nnow=d.datetime(2026,11,9,12,tzinfo=d.timezone.utc);s={'approved':True,'project_name':'mpt-rocket-12h-20261109','project_id':16725375,'server_id':101,'primary_ip_id':102,'nonce':'a'*32,'maximum_hours':12,'maximum_gross_eur':'2.00','first_billable_utc':now.isoformat(),'delete_at_utc':(now+d.timedelta(hours=4)).isoformat(),'hourly_gross_eur':'0.06924','other_gross_eur':'0'};checks={}\ndef fixture(state=s):\n data={'/servers/101':{'server':{'id':101,'labels':{'mpt-test-run':state['nonce']}}},'/primary_ips/102':{'primary_ip':{'id':102,'labels':{'mpt-test-run':state['nonce']},'assignee_id':101}}};calls=[]\n def api(m,p):\n  calls.append((m,p))\n  if m=='GET':return data.get(p)\n  data.pop(p,None)\n  if p=='/servers/101' and '/primary_ips/102' in data:data['/primary_ips/102']['primary_ip']['assignee_id']=None\n  return {}\n return data,calls,api\n_,calls,api=fixture();checks['before_deadline_read_only']=c.execute(s,api,now)=='ARMED_OWNERSHIP_VERIFIED' and all(m=='GET' for m,p in calls)\ndata,calls,api=fixture();checks['both_resources_deleted_and_verified']=c.execute(s,api,now+d.timedelta(hours=4))=='PASS_SERVER_AND_IPV4_DELETED' and not data\nchecks['idempotent_repeat']=c.execute(s,api,now+d.timedelta(hours=5))=='PASS_SERVER_AND_IPV4_DELETED'\nfor name,patch in [('wrong_project',{'project_name':'production'}),('missing_approval',{'approved':False}),('wrong_budget',{'maximum_gross_eur':'4.00'}),('too_costly',{'hourly_gross_eur':'0.20'}),('late_cleanup',{'delete_at_utc':(now+d.timedelta(hours=12)).isoformat()}),('missing_id',{'server_id':None})]:\n try:c.validate({**s,**patch});checks[name]=False\n except c.GuardError:checks[name]=True\ndata,calls,api=fixture();data['/servers/101']['server']['labels']['mpt-test-run']='other'\ntry:c.execute(s,api,now+d.timedelta(hours=4));checks['wrong_owner_no_delete']=False\nexcept c.GuardError:checks['wrong_owner_no_delete']=all(m=='GET' for m,p in calls)\nassert all(checks.values());print(json.dumps({'status':'PASS','checks':checks,'scope':'Synthetic API only. Does not query the provider or use the existing project token.'}))\n\nMPT_GENERIC_PY\ncat > test_cleanup_delayed_release.py <<'MPT_GENERIC_PY'\nimport cleanup_controller as c,datetime as d,json\nnow=d.datetime(2026,11,10,12,tzinfo=d.timezone.utc);s={'approved':True,'project_name':'mpt-rocket-12h-20261109','project_id':16725375,'server_id':101,'primary_ip_id':102,'nonce':'a'*32,'maximum_hours':12,'maximum_gross_eur':'2.00','first_billable_utc':(now-d.timedelta(hours=5)).isoformat(),'delete_at_utc':now.isoformat(),'hourly_gross_eur':'0.06924','other_gross_eur':'0.10'};c.time.sleep=lambda _:None\nchecks={}\nfor mode in ['delayed_unassign','parallel_delete','wrong_assignee']:\n state={'server':True,'ip':True,'after_delete_ip_reads':0};calls=[]\n def api(method,path):\n  calls.append((method,path))\n  if method=='DELETE':\n   state['server' if '/servers/' in path else 'ip']=False;return {}\n  if '/servers/' in path:return {'server':{'id':101,'labels':{'mpt-test-run':s['nonce']}}} if state['server'] else None\n  if not state['ip']:return None\n  owner=101\n  if not state['server']:\n   state['after_delete_ip_reads']+=1\n   if mode=='parallel_delete' and state['after_delete_ip_reads']>1:state['ip']=False;return None\n   if mode=='wrong_assignee':owner=999\n   elif state['after_delete_ip_reads']>=3:owner=None\n  return {'primary_ip':{'id':102,'labels':{'mpt-test-run':s['nonce']},'assignee_id':owner}}\n try:\n  result=c.execute(s,api,now);checks[mode]=mode!='wrong_assignee' and result=='PASS_SERVER_AND_IPV4_DELETED' and not state['ip']\n except c.GuardError:checks[mode]=mode=='wrong_assignee' and ('DELETE','/primary_ips/102') not in calls\nassert all(checks.values());print(json.dumps({'status':'PASS','checks':checks,'scope':'isolated API model, not a new provider teardown test'}))\n\nMPT_GENERIC_PY\ncat > check_readonly.py <<'MPT_GENERIC_PY'\n\"\"\"Real authentication probe. This entry point has no mutation operation.\"\"\"\nimport datetime, json, os, urllib.request\nfrom decimal import Decimal\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, *args, **kwargs):\n        return None\n\ndef run():\n    state = json.loads(os.environ['CLEANUP_STATE_JSON'])\n    assert state['project_id'] == 16725375\n    assert state['project_name'] == 'mpt-rocket-12h-20261109'\n    assert state['approved'] is True and state['maximum_hours'] == 12\n    assert Decimal(state['maximum_gross_eur']) == Decimal('2')\n    assert Decimal(state['hourly_gross_eur']) * 13 + Decimal(state['other_gross_eur']) <= 2\n    token = os.environ['HETZNER_TEST_PROJECT_TOKEN'].strip()\n    assert len(token) == 64 and token.isascii() and token.isalnum()\n    opener = urllib.request.build_opener(NoRedirect())\n    counts = {}\n    for kind in ['servers', 'primary_ips', 'volumes', 'load_balancers']:\n        request = urllib.request.Request(\n            'https://api.hetzner.cloud/v1/' + kind,\n            method='GET', headers={'Authorization': 'Bearer ' + token})\n        with opener.open(request, timeout=20) as response:\n            counts[kind] = len(json.load(response)[kind])\n    assert all(count == 0 for count in counts.values()), 'PROJECT_NOT_EMPTY'\n    print(json.dumps({'status': 'PASS_LIVE_AUTH_READONLY_EMPTY_PROJECT',\n                      'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),\n                      'counts': counts, 'mutation_requests': 0,\n                      'deletion_permission': 'NOT_PROVEN_BY_GET',\n                      'armed': False}), flush=True)\n\nif __name__ == '__main__':\n    try:\n        run()\n    except Exception:\n        print('FAIL_READONLY_PREFLIGHT_PRIVATE_DETAILS_WITHHELD', flush=True)\n        raise SystemExit(1)\n\nMPT_GENERIC_PY"
        },
        {
          "name": "Synthetic deadline ownership and IPv4 tests",
          "run": "python3 -B test_cleanup.py\npython3 -B test_cleanup_delayed_release.py"
        },
        {
          "name": "Real read-only authentication and empty-project gate",
          "run": "python3 -B check_readonly.py"
        },
        {
          "name": "Monitor exact nonce-owned resources",
          "if": "${{ inputs.mode == 'monitor' }}",
          "run": "python3 -B cleanup_controller.py"
        },
        {
          "name": "Independent failure signal",
          "if": "${{ failure() }}",
          "run": "echo '::error title=Rocket cleanup failure::Order gate CLOSED. Independent controller check failed; inspect this run before ordering.'\nexit 1"
        }
      ]
    }
  }
}
