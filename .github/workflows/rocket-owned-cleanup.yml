{
  "name": "Owned Rocket test cleanup \u2013 exact isolated resources",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {},
  "concurrency": {
    "group": "mpt-rocket-12h-20261109-cleanup",
    "cancel-in-progress": false
  },
  "jobs": {
    "cleanup": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "env": {
        "HETZNER_TEST_PROJECT_TOKEN": "${{ secrets.HETZNER_TEST_PROJECT_TOKEN }}",
        "CLEANUP_STATE_JSON": "${{ secrets.CLEANUP_STATE_JSON }}"
      },
      "steps": [
        {
          "name": "Continuously monitor exact owned resources; delete by five hours",
          "shell": "bash",
          "run": "python3 - <<'PY'\n\"\"\"Prepared, not armed. Deletes only two nonce-labelled resources from one new test project.\"\"\"\nimport datetime as dt, decimal, json, os, time, urllib.request, urllib.error\nclass GuardError(RuntimeError): pass\nclass ProviderError(RuntimeError): pass\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,*a,**k):raise GuardError(\"PROVIDER_REDIRECT_REFUSED\")\ndef validate(s):\n if s.get('approved') is not True or s.get('project_name')!='mpt-rocket-12h-20261109':raise GuardError('NEW_APPROVAL_REQUIRED')\n for k in ['project_id','server_id','primary_ip_id']:\n  if type(s.get(k)) is not int or s[k]<=0:raise GuardError('EXACT_IDS_REQUIRED')\n if len(s.get('nonce',''))<32:raise GuardError('OWNERSHIP_NONCE_REQUIRED')\n if s.get('maximum_hours')!=12 or decimal.Decimal(s.get('maximum_gross_eur','0'))!=decimal.Decimal('2.00'):raise GuardError('BUDGET_SCOPE')\n created=dt.datetime.fromisoformat(s['first_billable_utc']);due=dt.datetime.fromisoformat(s['delete_at_utc'])\n if not created.tzinfo or not due.tzinfo or not created<due<=created+dt.timedelta(hours=5):raise GuardError('EARLY_DELETE_REQUIRED')\n rate=decimal.Decimal(s['hourly_gross_eur'])\n if rate<=0 or rate*12+decimal.Decimal(s.get('other_gross_eur','0'))>decimal.Decimal('2.00'):raise GuardError('COST_CAP')\n return due\ndef owned(x,s,kind):\n if x.get('id')!=s[kind+'_id'] or x.get('labels',{}).get('mpt-test-run')!=s['nonce']:raise GuardError('OWNERSHIP_MISMATCH')\ndef execute(s,api,now):\n due=validate(s)\n server=api('GET','/servers/'+str(s['server_id']));ip=api('GET','/primary_ips/'+str(s['primary_ip_id']))\n if server:owned(server['server'],s,'server')\n if ip:\n  owned(ip['primary_ip'],s,'primary_ip')\n  if ip['primary_ip'].get('assignee_id') not in [None,s['server_id']]:raise GuardError('OTHER_IP_ASSIGNEE')\n if not server and not ip:return 'PASS_SERVER_AND_IPV4_DELETED'\n if now<due:return 'ARMED_OWNERSHIP_VERIFIED'\n if server:api('DELETE','/servers/'+str(s['server_id']))\n for _ in range(60):\n  if not api('GET','/servers/'+str(s['server_id'])):break\n  time.sleep(1)\n else:raise GuardError('SERVER_DELETE_NOT_VERIFIED')\n ip=api('GET','/primary_ips/'+str(s['primary_ip_id']))\n if ip:\n  owned(ip['primary_ip'],s,'primary_ip')\n  if ip['primary_ip'].get('assignee_id') is not None:raise GuardError('IP_NOT_RELEASED')\n  api('DELETE','/primary_ips/'+str(s['primary_ip_id']))\n if api('GET','/primary_ips/'+str(s['primary_ip_id'])):raise GuardError('IP_DELETE_NOT_VERIFIED')\n return 'PASS_SERVER_AND_IPV4_DELETED'\ndef main():\n s=json.loads(os.environ['CLEANUP_STATE_JSON']);token=os.environ['HETZNER_TEST_PROJECT_TOKEN'];assert token\n if s.get('approved') is not True or s.get('project_name')!='mpt-rocket-12h-20261109' or type(s.get('project_id')) is not int or len(s.get('nonce',''))<32:raise GuardError('PREORDER_SCOPE_REQUIRED')\n if s.get('maximum_hours')!=12 or decimal.Decimal(s.get('maximum_gross_eur','0'))!=decimal.Decimal('2.00') or decimal.Decimal(s['hourly_gross_eur'])*12+decimal.Decimal(s.get('other_gross_eur','0'))>decimal.Decimal('2.00'):raise GuardError('PREORDER_BUDGET_REFUSED')\n selector='?label_selector=mpt-test-run%3D'+s['nonce'];discovery={'/servers'+selector,'/primary_ips'+selector};allowed=set();start=dt.datetime.now(dt.timezone.utc)\n def api(method,path):\n  if not ((method=='GET' and path in discovery) or (method in ['GET','DELETE'] and path in allowed)):raise GuardError('ENDPOINT_REFUSED')\n  req=urllib.request.Request('https://api.hetzner.cloud/v1'+path,method=method,headers={'Authorization':'Bearer '+token})\n  try:\n   with urllib.request.build_opener(NoRedirect()).open(req,timeout=20) as r:b=r.read();return json.loads(b) if b else {}\n  except urllib.error.HTTPError as e:\n   if e.code==404:return None\n   raise ProviderError('PROVIDER_STATUS_'+str(e.code)) from None\n  except (urllib.error.URLError,TimeoutError,OSError):raise ProviderError('TRANSPORT') from None\n print('PREORDER_CONTROLLER_RUNNING_NO_BILLABLE_RESOURCE_REQUIRED',flush=True)\n # Run BEFORE ordering. Exact unique nonce/name and new project token bind at most one server and IP.\n while True:\n  try:\n   servers=api('GET','/servers'+selector)['servers'];ips=api('GET','/primary_ips'+selector)['primary_ips']\n  except ProviderError:\n   print('PROVIDER_RETRY_NO_SECRET_OUTPUT',flush=True);time.sleep(15);continue\n  if not servers and not ips and os.environ.get('RECOVERY_MODE')=='true':\n   print('PASS_NO_NONCE_OWNED_RESOURCES_REMAIN',flush=True);return\n  if len(servers)>1 or len(ips)>1:raise GuardError('AMBIGUOUS_DISCOVERY_NO_DELETE')\n  for x in servers+ips:\n   if x.get('labels',{}).get('mpt-test-run')!=s['nonce']:raise GuardError('NONCE_MISMATCH')\n  if servers and servers[0].get('name')!='mpt-rocket-12h-20261109':raise GuardError('SERVER_NAME_MISMATCH')\n  if servers and ips:\n   sv,ip=servers[0],ips[0]\n   if ip.get('assignee_id')!=sv['id']:raise GuardError('DISCOVERY_IP_ASSIGNMENT')\n   created=min(dt.datetime.fromisoformat(x['created'].replace('Z','+00:00')) for x in [sv,ip]);s.update(server_id=sv['id'],primary_ip_id=ip['id'],first_billable_utc=created.isoformat(),delete_at_utc=(created+dt.timedelta(hours=4,minutes=55)).isoformat());allowed.update(['/servers/'+str(s['server_id']),'/primary_ips/'+str(s['primary_ip_id'])]);validate(s);break\n  if ips and not servers:\n   ip=ips[0];age=(dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(ip['created'].replace('Z','+00:00'))).total_seconds()\n   if age>600:\n    if ip.get('assignee_id') is not None:raise GuardError('ORPHAN_IP_ASSIGNED')\n    path='/primary_ips/'+str(ip['id']);allowed.add(path);api('DELETE',path)\n    if api('GET',path):raise GuardError('ORPHAN_IP_DELETE_UNVERIFIED')\n    print('PASS_ORPHAN_IPV4_REMOVED',flush=True);return\n  if (dt.datetime.now(dt.timezone.utc)-start).total_seconds()>900:raise GuardError('ORDER_WINDOW_EXPIRED_NO_START')\n  print('PREORDER_OWNERSHIP_DISCOVERY_READY',flush=True);time.sleep(10)\n print('EXACT_RESOURCE_IDS_PINNED_IN_MEMORY',flush=True)\n while True:\n  try:result=execute(s,api,dt.datetime.now(dt.timezone.utc))\n  except ProviderError:\n   print('PROVIDER_RETRY_NO_SECRET_OUTPUT',flush=True);time.sleep(15);continue\n  print(result,flush=True)\n  if result=='PASS_SERVER_AND_IPV4_DELETED':return\n  time.sleep(min(60,max(1,(validate(s)-dt.datetime.now(dt.timezone.utc)).total_seconds())))\nif __name__=='__main__':\n try:main()\n except Exception as e:print('FAIL_CLEANUP_'+type(e).__name__,flush=True);raise SystemExit(1)\n\nPY"
        }
      ],
      "needs": "preflight"
    },
    "recovery": {
