R_CONTROLLER_RUNNING_NO_BILLABLE_RESOURCE_REQUIRED',flush=True)\n # Run BEFORE ordering. Exact unique nonce/name and new project token bind at most one server and IP.\n while True:\n  try:\n   servers=api('GET','/servers'+selector)['servers'];ips=api('GET','/primary_ips'+selector)['primary_ips']\n  except ProviderError:\n   print('PROVIDER_RETRY_NO_SECRET_OUTPUT',flush=True);time.sleep(15);continue\n  if not servers and not ips and os.environ.get('RECOVERY_MODE')=='true':\n   print('PASS_NO_NONCE_OWNED_RESOURCES_REMAIN',flush=True);return\n  if len(servers)>1 or len(ips)>1:raise GuardError('AMBIGUOUS_DISCOVERY_NO_DELETE')\n  for x in servers+ips:\n   if x.get('labels',{}).get('mpt-test-run')!=s['nonce']:raise GuardError('NONCE_MISMATCH')\n  if servers and servers[0].get('name')!='mpt-rocket-12h-20261109':raise GuardError('SERVER_NAME_MISMATCH')\n  if servers and ips:\n   sv,ip=servers[0],ips[0]\n   if ip.get('assignee_id')!=sv['id']:raise GuardError('DISCOVERY_IP_ASSIGNMENT')\n   created=min(dt.datetime.fromisoformat(x['created'].replace('Z','+00:00')) for x in [sv,ip]);s.update(server_id=sv['id'],primary_ip_id=ip['id'],first_billable_utc=created.isoformat(),delete_at_utc=(created+dt.timedelta(hours=4,minutes=55)).isoformat());allowed.update(['/servers/'+str(s['server_id']),'/primary_ips/'+str(s['primary_ip_id'])]);validate(s);break\n  if ips and not servers:\n   ip=ips[0];age=(dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(ip['created'].replace('Z','+00:00'))).total_seconds()\n   if age>600:\n    if ip.get('assignee_id') is not None:raise GuardError('ORPHAN_IP_ASSIGNED')\n    path='/primary_ips/'+str(ip['id']);allowed.add(path);api('DELETE',path)\n    if api('GET',path):raise GuardError('ORPHAN_IP_DELETE_UNVERIFIED')\n    print('PASS_ORPHAN_IPV4_REMOVED',flush=True);return\n  if (dt.datetime.now(dt.timezone.utc)-start).total_seconds()>900:raise GuardError('ORDER_WINDOW_EXPIRED_NO_START')\n  print('PREORDER_OWNERSHIP_DISCOVERY_READY',flush=True);time.sleep(10)\n print('EXACT_RESOURCE_IDS_PINNED_IN_MEMORY',flush=True)\n while True:\n  try:result=execute(s,api,dt.datetime.now(dt.timezone.utc))\n  except ProviderError:\n   print('PROVIDER_RETRY_NO_SECRET_OUTPUT',flush=True);time.sleep(15);continue\n  print(result,flush=True)\n  if result=='PASS_SERVER_AND_IPV4_DELETED':return\n  time.sleep(min(60,max(1,(validate(s)-dt.datetime.now(dt.timezone.utc)).total_seconds())))\nif __name__=='__main__':\n try:main()\n except Exception as e:print('FAIL_CLEANUP_'+type(e).__name__,flush=True);raise SystemExit(1)\n\nPY"
        }
      ],
      "needs": "cleanup",
      "if": "${{ failure() || cancelled() }}"
    },
    "preflight": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "env": {
        "HETZNER_TEST_PROJECT_TOKEN": "${{ secrets.HETZNER_TEST_PROJECT_TOKEN }}",
        "CLEANUP_STATE_JSON": "${{ secrets.CLEANUP_STATE_JSON }}"
      },
      "steps": [
        {
          "name": "Prove exact isolated project discovery before costs",
          "run": "python3 - <<'PY'\nimport os,json,urllib.request\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,*a,**k):return None\ns=json.loads(os.environ['CLEANUP_STATE_JSON']);assert s['project_id']==16725375 and s['approved'] and s['project_name']=='mpt-rocket-12h-20261109'\nfor kind in ['servers','primary_ips']:\n r=urllib.request.Request('https://api.hetzner.cloud/v1/'+kind+'?label_selector=mpt-test-run%3D'+s['nonce'],headers={'Authorization':'Bearer '+os.environ['HETZNER_TEST_PROJECT_TOKEN']})\n with urllib.request.build_opener(NoRedirect()).open(r,timeout=20) as x:assert json.load(x)[kind]==[]\nprint('PASS_PREORDER_PROJECT_READ_ONLY_DISCOVERY_NO_RESOURCES')\nPY"
        }
      ]
    }
  }
}