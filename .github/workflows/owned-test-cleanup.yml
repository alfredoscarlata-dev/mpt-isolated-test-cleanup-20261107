{
  "name": "Temporary owned test-resource cleanup",
  "on": {
    "workflow_dispatch": {},
    "schedule": [
      {
        "cron": "51,56 20 9 11 *"
      }
    ]
  },
  "permissions": {},
  "concurrency": {
    "group": "owned-test-cleanup-20261107",
    "cancel-in-progress": false
  },
  "jobs": {
    "cleanup": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "HETZNER_TEST_PROJECT_TOKEN": "${{ secrets.HETZNER_TEST_PROJECT_TOKEN }}",
        "CLEANUP_STATE_JSON": "${{ secrets.CLEANUP_STATE_JSON }}"
      },
      "steps": [
        {
          "name": "Guard original scope and delete only at original deadline",
          "shell": "bash",
          "run": "python3 - <<'PY'\nCONTROLLER_SOURCE = '\"\"\"External controller for the ONE explicitly recorded test server/IP.\\nRuns on the control Mac, never on the rented guest. No creation endpoints.\\nNo token, no matching ownership, or ambiguous state => no DELETE.\\n\"\"\"\\nimport pathlib,json,urllib.request,urllib.error,datetime,decimal,stat,os,time,argparse,fcntl\\nROOT=pathlib.Path(__file__).resolve().parent\\nEXPECTED_PROJECT=16701400\\nclass GuardError(RuntimeError):pass\\n\\ndef validate(s):\\n if s.get(\\'project_id\\')!=EXPECTED_PROJECT or s.get(\\'project_name\\')!=\\'mpt-security-isolated-20261107\\':raise GuardError(\\'Unexpected project\\')\\n if not s.get(\\'cost_authorization_received\\') or not s.get(\\'server_created\\'):raise GuardError(\\'No created authorized test server recorded\\')\\n if s.get(\\'maximum_hours\\')!=48 or decimal.Decimal(s.get(\\'maximum_total_gross_eur\\',\\'0\\'))!=decimal.Decimal(\\'4.00\\'):raise GuardError(\\'Scope exceeds approval\\')\\n for k in [\\'server_id\\',\\'primary_ip_id\\']:\\n  if type(s.get(k)) is not int or s[k]<=0:raise GuardError(\\'Missing exact resource ID\\')\\n if len(s.get(\\'resource_nonce\\',\\'\\'))<20:raise GuardError(\\'Missing unique ownership nonce\\')\\n created=datetime.datetime.fromisoformat(s[\\'first_billable_created_utc\\']);deadline=datetime.datetime.fromisoformat(s[\\'delete_by_utc\\'])\\n if created.tzinfo is None or deadline.tzinfo is None or not created<deadline<=created+datetime.timedelta(hours=46):raise GuardError(\\'Deadline must start cleanup at least two hours before maximum lifetime\\')\\n rate=decimal.Decimal(s[\\'conservative_hourly_gross_eur\\'])\\n if rate<=0 or rate*48>decimal.Decimal(\\'4\\'):raise GuardError(\\'Conservative full-duration budget fails\\')\\n return deadline\\n\\ndef owned(obj,s,kind):\\n if obj.get(\\'id\\')!=s[kind+\\'_id\\'] or obj.get(\\'labels\\',{}).get(\\'mpt-test-run\\')!=s[\\'resource_nonce\\']:raise GuardError(\\'Resource ID/unique ownership label mismatch; refuse deletion\\')\\n\\ndef execute(s,api,now,force=False):\\n deadline=validate(s)\\n if not force and now<deadline:return {\\'status\\':\\'ARMED_NOT_DUE\\',\\'delete_by_utc\\':s[\\'delete_by_utc\\']}\\n sv=api(\\'GET\\',\\'/servers/\\'+str(s[\\'server_id\\']))\\n ip=api(\\'GET\\',\\'/primary_ips/\\'+str(s[\\'primary_ip_id\\']))\\n if sv is not None:owned(sv[\\'server\\'],s,\\'server\\')\\n if ip is not None:\\n  owned(ip[\\'primary_ip\\'],s,\\'primary_ip\\')\\n  if ip[\\'primary_ip\\'].get(\\'assignee_id\\') not in [None,s[\\'server_id\\']]:raise GuardError(\\'IP assigned to another server\\')\\n # Both identities checked before first mutation; never iterate and delete broad lists.\\n if sv is not None:api(\\'DELETE\\',\\'/servers/\\'+str(s[\\'server_id\\']))\\n for _ in range(60):\\n  if api(\\'GET\\',\\'/servers/\\'+str(s[\\'server_id\\'])) is None:break\\n  time.sleep(1)\\n else:raise GuardError(\\'Server removal not confirmed; must escalate, never claim billing stopped\\')\\n ip=api(\\'GET\\',\\'/primary_ips/\\'+str(s[\\'primary_ip_id\\']))\\n if ip is not None:\\n  owned(ip[\\'primary_ip\\'],s,\\'primary_ip\\')\\n  if ip[\\'primary_ip\\'].get(\\'assignee_id\\') is not None:raise GuardError(\\'IP not released yet\\')\\n  api(\\'DELETE\\',\\'/primary_ips/\\'+str(s[\\'primary_ip_id\\']))\\n if api(\\'GET\\',\\'/primary_ips/\\'+str(s[\\'primary_ip_id\\'])) is not None:raise GuardError(\\'Primary IPv4 deletion not confirmed\\')\\n return {\\'status\\':\\'PASS_SERVER_AND_IPV4_GONE\\',\\'server_id\\':s[\\'server_id\\'],\\'primary_ip_id\\':s[\\'primary_ip_id\\']}\\n\\ndef main():\\n p=argparse.ArgumentParser();p.add_argument(\\'--state\\',default=str(ROOT/\\'STATE.json\\'));p.add_argument(\\'--token-file\\',required=True);p.add_argument(\\'--now\\',action=\\'store_true\\',help=\\'Approved final cleanup before deadline\\');a=p.parse_args()\\n state_pre=json.loads(pathlib.Path(a.state).read_text())\\n if state_pre.get(\\'project_id\\')==EXPECTED_PROJECT and state_pre.get(\\'project_name\\')==\\'mpt-security-isolated-20261107\\' and not state_pre.get(\\'server_created\\'):\\n  result={\\'status\\':\\'ARMED_NO_BILLABLE_RESOURCES\\',\\'utc\\':datetime.datetime.now(datetime.timezone.utc).isoformat()};(ROOT/\\'teardown-last-result.json\\').write_text(json.dumps(result,indent=2));print(json.dumps(result));return\\n f=pathlib.Path(a.token_file);mode=f.stat().st_mode\\n if stat.S_IMODE(mode)!=0o600 or f.stat().st_uid!=os.getuid():raise GuardError(\\'Token file requires owner-only0600\\')\\n token=f.read_text().strip()\\n if not token:raise GuardError(\\'Missing project-scoped API token\\')\\n lock=(ROOT/\\'controller.lock\\').open(\\'a\\');fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB);s=json.loads(pathlib.Path(a.state).read_text());validate(s)\\n def api(method,path):\\n  if not path.startswith((\\'/servers/\\',\\'/primary_ips/\\')):raise GuardError(\\'Endpoint outside exact teardown scope\\')\\n  q=urllib.request.Request(\\'https://api.hetzner.cloud/v1\\'+path,method=method,headers={\\'Authorization\\':\\'Bearer \\'+token,\\'Content-Type\\':\\'application/json\\'})\\n  try:\\n   with urllib.request.urlopen(q,timeout=20) as response:b=response.read();return json.loads(b) if b else {}\\n  except urllib.error.HTTPError as e:\\n   if e.code==404:return None\\n   raise GuardError(\\'Provider HTTP status \\'+str(e.code)) from None\\n result=execute(s,api,datetime.datetime.now(datetime.timezone.utc),a.now);result[\\'utc\\']=datetime.datetime.now(datetime.timezone.utc).isoformat();(ROOT/\\'teardown-last-result.json\\').write_text(json.dumps(result,indent=2));print(json.dumps(result))\\nif __name__==\\'__main__\\':main()\\n'\nimport os,json,datetime,time,urllib.request,urllib.error\nns={'__name__':'cleanup_library','__file__':'/tmp/in-memory-cleanup.py'}\nexec(compile(CONTROLLER_SOURCE,'cleanup_library','exec'),ns)\ntry:\n s=json.loads(os.environ['CLEANUP_STATE_JSON'])\n assert s['project_id']==16701400 and s['server_id']==175046617 and s['primary_ip_id']==161068666\n assert s['first_billable_created_utc']=='2026-11-07T22:56:04+00:00'\n assert s['delete_by_utc']=='2026-11-09T20:56:04+00:00'\n assert s['absolute_latest_delete_utc']=='2026-11-09T22:56:04+00:00'\n assert s['maximum_hours']==48 and s['maximum_total_gross_eur']=='4.00'\n deadline=ns['validate'](s)\n token=os.environ['HETZNER_TEST_PROJECT_TOKEN'].strip()\n assert token\n allowed={'/servers/'+str(s['server_id']),'/primary_ips/'+str(s['primary_ip_id'])}\n def api(method,path):\n  if method not in ('GET','DELETE') or path not in allowed:raise ns['GuardError']('Endpoint outside exact owned resources')\n  if method=='DELETE' and datetime.datetime.now(datetime.timezone.utc)<deadline:raise ns['GuardError']('Deletion before original deadline refused')\n  q=urllib.request.Request('https://api.hetzner.cloud/v1'+path,method=method,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})\n  try:\n   with urllib.request.urlopen(q,timeout=20) as response:\n    body=response.read();return json.loads(body) if body else {}\n  except urllib.error.HTTPError as e:\n   if e.code==404:return None\n   raise ns['GuardError']('Provider HTTP status '+str(e.code)) from None\n  except (OSError,ValueError):raise ns['GuardError']('Provider transport or response failed') from None\n # A real read-only preflight, even when the deadline is still far away.\n sv=api('GET','/servers/'+str(s['server_id']));ip=api('GET','/primary_ips/'+str(s['primary_ip_id']))\n if sv is not None:ns['owned'](sv['server'],s,'server')\n if ip is not None:\n  ns['owned'](ip['primary_ip'],s,'primary_ip')\n  if ip['primary_ip'].get('assignee_id') not in (None,s['server_id']):raise ns['GuardError']('Unexpected IP assignment')\n remaining=(deadline-datetime.datetime.now(datetime.timezone.utc)).total_seconds()\n if 0<remaining<=330:time.sleep(remaining)\n result=ns['execute'](s,api,datetime.datetime.now(datetime.timezone.utc),False)\n # Do not echo Secret payloads or resource identifiers into logs.\n print(json.dumps({'status':result['status'],'ownership_preflight':'PASS','utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}))\nexcept Exception as error:\n print(json.dumps({'status':'FAIL_CLEANUP_GUARD_OR_PROVIDER','error_type':type(error).__name__}))\n raise SystemExit(1)\n\nPY"
        }
      ]
    }
  }
}
